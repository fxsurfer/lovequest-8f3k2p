<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AIジョニー | LOVEQUESTプレイヤー図鑑</title>
<style>
:root{
  --bg:#0D0D1A; --card:#1A1A35; --card2:#12122A;
  --gold:#F5A623; --red:#E94560; --blue:#4A9EDB;
  --green:#4CAF73; --purple:#7B5EA7;
  --white:#FFFFFF; --light:#E0E0E0; --muted:#8888AA;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Yu Gothic UI','Hiragino Sans','Meiryo',sans-serif;
  background:var(--bg);color:var(--light)}

.app{min-height:100vh}

.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid #2a2a4a;background:linear-gradient(135deg,#0D0D1A 0%,#1A0D2E 100%);
  position:sticky;top:0;z-index:60}
.hamburger{font-size:20px;cursor:pointer;color:var(--light);background:none;border:none;padding:4px;line-height:1}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--purple);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.titles{min-width:0}
.t-title{font-size:14.5px;font-weight:900;color:var(--white);white-space:nowrap}
.t-sub{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;flex-shrink:0}
.new-chat-btn{margin-left:auto;font-size:11px;padding:6px 12px;border-radius:14px;
  border:1px solid #444;background:transparent;color:var(--muted);cursor:pointer}
.new-chat-btn:hover{border-color:var(--gold);color:var(--gold)}

.layout{display:flex;align-items:flex-start}

.sidebar{width:150px;flex-shrink:0;border-right:1px solid #2a2a4a;background:var(--card2);
  padding:10px 6px;transition:margin-left .2s;
  position:sticky;top:57px;max-height:calc(100vh - 57px);overflow-y:auto}
.sidebar.collapsed{margin-left:-156px}
.sidebar-label{font-size:10px;color:var(--muted);padding:4px 8px;margin-bottom:4px;letter-spacing:.5px}
.history-item{font-size:11px;padding:8px;border-radius:8px;color:var(--muted);
  margin-bottom:3px;cursor:default}
.history-empty{font-size:10.5px;color:var(--muted);padding:8px;line-height:1.6;text-align:center}

.main{flex:1;min-width:0;padding:20px 16px}
.main-inner{max-width:620px;margin:0 auto}

.welcome{text-align:center;margin-bottom:20px}
.welcome .w-icon{font-size:44px}
.welcome .w-title{font-size:16px;font-weight:900;color:var(--white);margin-top:6px}
.welcome .w-sub{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.6}

.demo-badge{display:inline-block;background:#2A0D1A;border:1px solid var(--red);color:var(--red);
  font-size:10.5px;padding:4px 12px;border-radius:12px;margin-bottom:14px}

/* drop zone */
.dropzone{background:var(--card);border:2px dashed #3a3a5a;border-radius:16px;
  padding:32px 20px;text-align:center;cursor:pointer;transition:.15s;margin-bottom:14px}
.dropzone.dragover{border-color:var(--gold);background:var(--card2)}
.dropzone .dz-icon{font-size:36px}
.dropzone .dz-text{font-size:13px;color:var(--light);margin-top:8px;font-weight:700}
.dropzone .dz-sub{font-size:11px;color:var(--muted);margin-top:4px}
#fileInput{display:none}

.file-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.file-chip{background:var(--card);border:1px solid var(--green);border-radius:10px;
  padding:8px 10px;font-size:11.5px;display:flex;align-items:center;gap:8px;max-width:200px}
.file-chip .fc-icon{font-size:18px;flex-shrink:0}
.file-chip .fc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.file-chip .fc-remove{cursor:pointer;color:var(--muted);flex-shrink:0;font-size:14px}
.file-chip .fc-remove:hover{color:var(--red)}
.file-chip img{width:32px;height:32px;object-fit:cover;border-radius:6px;flex-shrink:0}

.text-note{width:100%;background:var(--card2);border:1px solid #2a2a4a;border-radius:10px;
  padding:10px 12px;font-size:12.5px;color:var(--light);resize:vertical;min-height:60px;
  font-family:inherit;margin-bottom:14px}
.text-note::placeholder{color:var(--muted)}

.analyze-btn{display:block;width:100%;font-size:13.5px;padding:11px;border-radius:14px;
  border:none;background:var(--gold);color:var(--bg);font-weight:900;cursor:pointer;margin-bottom:20px}
.analyze-btn:disabled{opacity:.4;cursor:default}
.analyze-btn:hover:not(:disabled){filter:brightness(1.08)}

/* chat area */
.chat-log{display:flex;flex-direction:column;gap:14px}
.msg-user{align-self:flex-end;background:var(--card2);border-radius:14px 14px 4px 14px;
  padding:10px 14px;font-size:12.5px;max-width:80%}
.bubble{background:var(--card);border-radius:14px 14px 14px 4px;padding:14px;
  display:flex;gap:10px;align-items:flex-start;max-width:90%}
.bubble .b-avatar{width:30px;height:30px;border-radius:50%;background:var(--purple);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.bubble .b-body{flex:1;min-width:0;font-size:12.5px;line-height:1.85;color:var(--light)}
.bubble .b-body p{margin-bottom:9px}
.bubble .b-body .sec-h{color:var(--gold);font-weight:900;font-size:13px;margin:14px 0 6px}
.bubble .b-body p:first-child{margin-top:0}
.typing{display:flex;gap:4px;padding:6px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);
  animation:blink 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

.loading{text-align:center;color:var(--muted);font-size:13px;padding:60px 20px}

@media(max-width:600px){
  .sidebar{position:fixed;left:0;top:57px;bottom:0;z-index:50;box-shadow:2px 0 12px rgba(0,0,0,.4)}
}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="avatar">🧠</div>
    <div class="titles">
      <div class="t-title">AIジョニー</div>
      <div class="t-sub"><span class="dot"></span>写真・動画・テキストからタイプを分析</div>
    </div>
    <button class="new-chat-btn" onclick="resetChat()">＋ 新規分析</button>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-label">分析履歴</div>
      <div class="history-empty">まだ履歴はありません。<br>分析すると、ここに<br>記録されます。</div>
    </div>

    <div class="main">
      <div class="main-inner">
        <div class="welcome">
          <div class="w-icon">🔮</div>
          <div class="w-title">AIジョニーへようこそ</div>
          <div class="w-sub">気になる相手の写真・動画・プロフィール文章をドラッグ&ドロップすると、<br>タイプ診断・相性・デートプランを分析します</div>
        </div>

        <div style="text-align:center">
          <div class="demo-badge">⚠️ デモ版：現在はサンプル応答です（本番API未接続）</div>
        </div>

        <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
          <div class="dz-icon">📥</div>
          <div class="dz-text">写真・動画をドラッグ&ドロップ、またはタップして選択</div>
          <div class="dz-sub">対応形式: JPG / PNG / MP4 / MOV（複数選択可）</div>
          <input type="file" id="fileInput" multiple accept="image/*,video/*">
        </div>

        <div class="file-list" id="fileList"></div>

        <textarea class="text-note" id="textNote" placeholder="プロフィール文章や気になる発言があれば貼り付けてください（任意）"></textarea>

        <button class="analyze-btn" id="analyzeBtn" onclick="runAnalysis()" disabled>🔍 分析する</button>

        <div class="chat-log" id="chatLog"></div>
      </div>
    </div>
  </div>
</div>

<script>
let uploadedFiles = [];

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('collapsed');
}

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');

['dragover'].forEach(evt => {
  dropzone.addEventListener(evt, e => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });
});
['dragleave','drop'].forEach(evt => {
  dropzone.addEventListener(evt, e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
  });
});
dropzone.addEventListener('drop', e => {
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => {
  handleFiles(e.target.files);
});

function handleFiles(fileListObj){
  Array.from(fileListObj).forEach(f => {
    uploadedFiles.push(f);
  });
  renderFileList();
  updateAnalyzeBtn();
}

function removeFile(idx){
  uploadedFiles.splice(idx, 1);
  renderFileList();
  updateAnalyzeBtn();
}

function renderFileList(){
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  uploadedFiles.forEach((f, idx) => {
    const chip = document.createElement('div');
    chip.className = 'file-chip';
    const isImage = f.type.startsWith('image/');
    const icon = isImage ? '' : (f.type.startsWith('video/') ? '🎬' : '📄');
    let thumbHtml = '';
    if(isImage && typeof URL !== 'undefined' && URL.createObjectURL){
      try {
        const url = URL.createObjectURL(f);
        thumbHtml = `<img src="${url}">`;
      } catch(e){}
    }
    chip.innerHTML = `${thumbHtml || `<span class="fc-icon">${icon || '📄'}</span>`}` +
      `<span class="fc-name">${escapeHtml(f.name)}</span>` +
      `<span class="fc-remove" data-idx="${idx}">✕</span>`;
    chip.querySelector('.fc-remove').onclick = () => removeFile(idx);
    list.appendChild(chip);
  });
}

function updateAnalyzeBtn(){
  const note = document.getElementById('textNote').value.trim();
  document.getElementById('analyzeBtn').disabled = (uploadedFiles.length === 0 && note === '');
}
document.getElementById('textNote').addEventListener('input', updateAnalyzeBtn);

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const DEMO_RESULT = {
  title: '診断結果（サンプル）',
  sections: [
    { h: '🔮 タイプ診断', body: 'アップロードされた情報から、<b>占い師タイプ（魔法使い×僧侶）</b>の可能性が高いと見立てました。表情はクールですが、優しい空気をまとっている点が特徴です。' },
    { h: '💞 相性の見立て', body: 'あなたのタイプとの相性は良好です。ただし、相手は「察してほしい」タイプなので、こちらから積極的に気持ちを言葉にすることが関係を深めるカギになります。' },
    { h: '🍽 おすすめデートプラン', body: '静かなカフェ、神社、美術館など、落ち着いた雰囲気の場所がおすすめです。初回はランチ＋短時間で様子を見ましょう。' },
    { h: '🛡 攻略のヒント', body: '「今日はどう感じた？」など、感情を尋ねる一言を意識してみてください。安心できる空気を作れると、少しずつ心を開いてくれるはずです。' },
  ]
};

function runAnalysis(){
  const note = document.getElementById('textNote').value.trim();
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;

  const log = document.getElementById('chatLog');

  const userMsg = document.createElement('div');
  userMsg.className = 'msg-user';
  const fileSummary = uploadedFiles.length ? `📎 ${uploadedFiles.length}件のファイル` : '';
  userMsg.textContent = [fileSummary, note].filter(Boolean).join(' / ') || '（分析リクエスト）';
  log.appendChild(userMsg);

  const typingBubble = document.createElement('div');
  typingBubble.className = 'bubble';
  typingBubble.innerHTML = `<div class="b-avatar">🧠</div><div class="b-body"><div class="typing"><span></span><span></span><span></span></div></div>`;
  log.appendChild(typingBubble);
  typingBubble.scrollIntoView({behavior:'smooth', block:'end'});

  setTimeout(() => {
    typingBubble.remove();
    const resultBubble = document.createElement('div');
    resultBubble.className = 'bubble';
    let bodyHtml = '';
    DEMO_RESULT.sections.forEach(s => {
      bodyHtml += `<div class="sec-h">${s.h}</div><p>${s.body}</p>`;
    });
    resultBubble.innerHTML = `<div class="b-avatar">🧠</div><div class="b-body">${bodyHtml}</div>`;
    log.appendChild(resultBubble);
    resultBubble.scrollIntoView({behavior:'smooth', block:'start'});
    btn.disabled = false;
  }, 1400);
}

function resetChat(){
  uploadedFiles = [];
  document.getElementById('textNote').value = '';
  document.getElementById('fileList').innerHTML = '';
  document.getElementById('chatLog').innerHTML = '';
  updateAnalyzeBtn();
}
</script>
</body>
</html>
