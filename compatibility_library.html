<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>相性ライブラリ | LOVEQUESTプレイヤー図鑑</title>
<style>
:root{
  --bg:#0D0D1A; --card:#1A1A35; --card2:#12122A;
  --gold:#F5A623; --red:#E94560; --blue:#4A9EDB;
  --green:#4CAF73; --purple:#7B5EA7;
  --white:#FFFFFF; --light:#E0E0E0; --muted:#8888AA;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Yu Gothic UI','Hiragino Sans','Meiryo',sans-serif;
  background:var(--bg);color:var(--light);overflow-x:hidden}

.app{display:flex;flex-direction:column;min-height:100vh}

/* header */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid #2a2a4a;background:linear-gradient(135deg,#0D0D1A 0%,#1A0D2E 100%);flex-shrink:0}
.hamburger{font-size:20px;cursor:pointer;color:var(--light);background:none;border:none;padding:4px;line-height:1}
.topbar .avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.topbar .titles{min-width:0}
.topbar .t-title{font-size:14.5px;font-weight:900;color:var(--white);white-space:nowrap}
.topbar .t-sub{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;flex-shrink:0}

/* layout */
.layout{display:flex;flex:1;min-height:0}

/* sidebar */
.sidebar{width:140px;flex-shrink:0;border-right:1px solid #2a2a4a;background:var(--card2);
  padding:10px 6px;overflow-y:auto;transition:margin-left .2s}
.sidebar.collapsed{margin-left:-146px}
.sidebar-label{font-size:10px;color:var(--muted);padding:4px 8px;margin-bottom:4px;letter-spacing:.5px}
.side-item{font-size:11px;padding:7px 8px;border-radius:8px;background:transparent;
  display:flex;gap:6px;align-items:center;cursor:pointer;margin-bottom:3px;color:var(--light);
  border:1px solid transparent}
.side-item:hover{background:var(--card)}
.side-item.active{background:var(--gold);color:var(--bg);font-weight:700}
.side-item .icon{font-size:14px;flex-shrink:0}
.side-item .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* main */
.main{flex:1;min-width:0;padding:20px 16px;overflow-y:auto}
.main-inner{max-width:600px;margin:0 auto}

.welcome{text-align:center;margin-bottom:18px}
.welcome .w-icon{font-size:44px}
.welcome .w-title{font-size:16px;font-weight:900;color:var(--white);margin-top:6px}
.welcome .w-sub{font-size:11.5px;color:var(--muted);margin-top:3px}

.partner-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:18px}
.partner-tag{background:var(--card);border:1.5px solid var(--green);border-radius:16px;
  padding:6px 12px;font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:.15s}
.partner-tag:hover{border-color:var(--gold);transform:translateY(-1px)}
.partner-tag.pending{border-color:#444;opacity:.5;cursor:default}
.partner-tag.pending:hover{transform:none}

.stats-line{text-align:center;font-size:10.5px;color:var(--muted);margin-bottom:14px}
.random-btn{display:block;margin:0 auto 18px;font-size:11.5px;padding:6px 16px;border-radius:16px;
  border:1px solid #444;background:transparent;color:var(--muted);cursor:pointer}
.random-btn:hover{border-color:var(--gold);color:var(--gold)}

/* chat bubble article */
.bubble{background:var(--card);border-radius:16px;padding:16px;display:flex;gap:10px;align-items:flex-start}
.bubble .b-avatar{width:32px;height:32px;border-radius:50%;background:var(--green);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.bubble .b-body{flex:1;min-width:0}
.bubble .b-title{font-size:13px;font-weight:900;color:var(--gold);margin-bottom:8px}
.art-body{font-size:13px;line-height:1.85;color:var(--light)}
.art-body p{margin-bottom:9px}
.art-body .sec-h{color:var(--gold);font-weight:900;font-size:13px;margin:16px 0 6px;
  padding-bottom:3px;border-bottom:1px solid #2a2a4a}
.art-body p:first-child{margin-top:0}
.source-tag{font-size:9.5px;color:var(--muted);text-align:right;margin-top:12px}

.missing{background:var(--card);border:2px solid var(--red);border-radius:16px;
  padding:20px;text-align:center}
.missing .m-icon{font-size:34px;margin-bottom:6px}
.missing .m-title{font-size:13.5px;font-weight:900;color:var(--red)}
.missing .m-desc{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.7}
.fallback-link{display:inline-block;margin-top:12px;font-size:11.5px;padding:7px 16px;border-radius:16px;
  background:var(--gold);color:var(--bg);font-weight:900;text-decoration:none}

.loading{text-align:center;color:var(--muted);font-size:13px;padding:60px 20px}

@media(max-width:600px){
  .sidebar{position:fixed;left:0;top:57px;bottom:0;z-index:50;box-shadow:2px 0 12px rgba(0,0,0,.4)}
  .sidebar.collapsed{margin-left:-146px}
}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="avatar" id="topAvatar">🔮</div>
    <div class="titles">
      <div class="t-title">相性ライブラリ</div>
      <div class="t-sub"><span class="dot"></span>ジョニー執筆・16タイプの本物の相性解説</div>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-label">目次（タイプ）</div>
      <div id="sideList"></div>
    </div>

    <div class="main">
      <div class="main-inner">
        <div class="loading" id="loading">読み込み中...</div>

        <div id="mainUI" style="display:none">
          <div class="welcome">
            <div class="w-icon" id="welcomeIcon">⭐</div>
            <div class="w-title" id="welcomeTitle">占い師タイプ の相性</div>
            <div class="w-sub">気になる相手のタイプを選んでね</div>
          </div>

          <div class="partner-row" id="partnerRow"></div>
          <div class="stats-line" id="statsBar"></div>
          <button class="random-btn" onclick="randomEntry()">🎲 ランダムに読む</button>

          <div id="article" style="display:none">
            <div class="bubble">
              <div class="b-avatar" id="artAvatar"></div>
              <div class="b-body">
                <div class="b-title" id="artTitle"></div>
                <div class="art-body" id="artBody"></div>
                <div class="source-tag" id="artSource"></div>
              </div>
            </div>
          </div>

          <div id="missing" style="display:none">
            <div class="missing">
              <div class="m-icon">📝</div>
              <div class="m-title">この組み合わせはまだ執筆中です</div>
              <div class="m-desc" id="missingDesc"></div>
              <a class="fallback-link" href="player_encyclopedia.html" target="_blank">🔮 仮の自動診断結果を見る（プレイヤー図鑑）</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const TYPES = [
  {code:'狂戦士',icon:'⚔️'}, {code:'勇者',icon:'🦸'}, {code:'魔法戦士',icon:'🧙'}, {code:'聖戦士',icon:'🛡️'},
  {code:'姫',icon:'👸'}, {code:'騎士',icon:'🏇'}, {code:'盗賊',icon:'🗡️'}, {code:'妖精',icon:'🧚'},
  {code:'シスター',icon:'🌿'}, {code:'兵士',icon:'🪖'}, {code:'牧師',icon:'📖'}, {code:'賢者',icon:'🦉'},
  {code:'魔道士',icon:'🔮'}, {code:'忍者',icon:'🥷'}, {code:'道化師',icon:'🎭'}, {code:'占い師',icon:'⭐'},
];
const ICON_BY_NAME = Object.fromEntries(TYPES.map(t=>[t.code,t.icon]));

let LIBRARY = [];
let PAIR_INDEX = {};
let selA = TYPES.find(t=>t.code==='占い師');
let selB = null;

function pairKey(a,b){ return [a,b].sort().join('|'); }

fetch('data/compat_library.json')
  .then(r => r.json())
  .then(data => {
    LIBRARY = data;
    data.forEach(e => { PAIR_INDEX[pairKey(e.typeA, e.typeB)] = e; });
    document.getElementById('loading').style.display = 'none';
    document.getElementById('mainUI').style.display = 'block';
    renderSidebar();
    renderWelcome();
    const total = TYPES.length*(TYPES.length+1)/2;
    document.getElementById('statsBar').textContent = `現在 ${data.length} / ${total} 通り収録済み`;
  })
  .catch(err => {
    document.getElementById('loading').textContent = '読み込みに失敗しました。data/compat_library.json を確認してください。';
    console.error(err);
  });

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('collapsed');
}

function renderSidebar(){
  const list = document.getElementById('sideList');
  list.innerHTML = '';
  TYPES.forEach(t => {
    const d = document.createElement('div');
    d.className = 'side-item' + (t.code===selA.code ? ' active' : '');
    d.innerHTML = `<span class="icon">${t.icon}</span><span class="name">${t.code}</span>`;
    d.onclick = () => { selA = t; selB = null; renderSidebar(); renderWelcome(); hideResult(); };
    list.appendChild(d);
  });
}

function renderWelcome(){
  document.getElementById('welcomeIcon').textContent = selA.icon;
  document.getElementById('topAvatar').textContent = selA.icon;
  document.getElementById('welcomeTitle').textContent = `${selA.code}タイプ の相性`;

  const row = document.getElementById('partnerRow');
  row.innerHTML = '';
  TYPES.forEach(t => {
    const key = pairKey(selA.code, t.code);
    const exists = !!PAIR_INDEX[key];
    const tag = document.createElement('div');
    tag.className = 'partner-tag' + (exists ? '' : ' pending');
    tag.innerHTML = `<span>${t.icon}</span><span>${t.code}</span><span>${exists?'✓':'…'}</span>`;
    if(exists){
      tag.onclick = () => { selB = t; showEntry(); };
    }
    row.appendChild(tag);
  });
}

const HEAD_KEYWORDS = ['ポイント','相性','あるある','まとめ','話し方','注意するべき','恋愛・結婚','友達としての','家族としての'];
function looksLikeHeading(line){
  if(line.length === 0 || line.length > 45) return false;
  if(line.endsWith('。')) return false;
  return HEAD_KEYWORDS.some(k => line.includes(k));
}
function renderContent(content){
  const paras = content.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
  let html = '';
  paras.forEach(p => {
    const lines = p.split('\n').map(l=>l.trim()).filter(Boolean);
    lines.forEach(line => {
      if(looksLikeHeading(line)){
        html += `<div class="sec-h">${escapeHtml(line)}</div>`;
      } else {
        html += `<p>${escapeHtml(line)}</p>`;
      }
    });
  });
  return html;
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function hideResult(){
  document.getElementById('article').style.display = 'none';
  document.getElementById('missing').style.display = 'none';
}

function showEntry(){
  if(!selB) return;
  const key = pairKey(selA.code, selB.code);
  const entry = PAIR_INDEX[key];
  if(!entry){
    document.getElementById('article').style.display = 'none';
    document.getElementById('missing').style.display = 'block';
    document.getElementById('missingDesc').textContent =
      `「${selA.code}×${selB.code}」の詳細解説は現在ジョニーさんが執筆中です。届き次第このページに反映されます。`;
    return;
  }
  document.getElementById('missing').style.display = 'none';
  document.getElementById('article').style.display = 'block';
  document.getElementById('artAvatar').textContent = ICON_BY_NAME[entry.typeB] || '❓';
  document.getElementById('artTitle').textContent = `${entry.typeA} × ${entry.typeB}`;
  document.getElementById('artBody').innerHTML = renderContent(entry.content);
  document.getElementById('artSource').textContent = `出典: 恋愛式学 継承マスター資料（${entry.source}）`;
  document.getElementById('article').scrollIntoView({behavior:'smooth', block:'start'});
}

function randomEntry(){
  const entry = LIBRARY[Math.floor(Math.random()*LIBRARY.length)];
  selA = TYPES.find(t=>t.code===entry.typeA) || {code:entry.typeA, icon:'❓'};
  selB = TYPES.find(t=>t.code===entry.typeB) || {code:entry.typeB, icon:'❓'};
  renderSidebar();
  renderWelcome();
  showEntry();
}
</script>
</body>
</html>
